    # No custom Docker healthcheck here → uses image's built-in one

  qbittorrent:
    image: linuxserver/qbittorrent:4.5.5
    container_name: qbittorrent
      #network_mode: "service:gluetun"
      #depends_on:
      #  gluetun:
      #    condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - QBT_Preferences__WebUI__BypassLocalAuth=true
      - QBT_Preferences__WebUI__BypassAuthSubnetWhitelist=${LAN_SUBNET},172.16.0.0/12
    volumes:
      - ./qbittorrent/config:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080"
    restart: unless-stopped

  clamav:
    build: ./clamav
    container_name: clamav
    volumes:
      - ./downloads:/downloads
      - ./clamav/db:/var/lib/clamav
    restart: unless-stopped

  media-browser:
    build: ./media-browser
    container_name: media-browser
    environment:
      - PORT=3000
      - DOWNLOADS_PATH=/downloads
      - DATA_PATH=/data
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      - OPENSUBTITLES_USER=${OPENSUBTITLES_USER:-}
      - OPENSUBTITLES_PASS=${OPENSUBTITLES_PASS:-}
    volumes:
      - ./downloads:/downloads:ro
      - ./media-browser/data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped
